name: Deploy to Firebase

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - name: Create .env file
        run: |
          echo "API_BASE_URL=https://api.jarvis.cx" >> .env
          echo "AUTH_BASE_URL=https://auth-api.jarvis.cx" >> .env
          echo "KNOWLEDGE_BASE_URL=https://knowledge-api.jarvis.cx" >> .env
          echo "STACK_ACCESS_TYPE=client" >> .env
          echo "STACK_PROJECT_ID=${{ secrets.STACK_PROJECT_ID }}" >> .env
          echo "STACK_PUBLISHABLE_CLIENT_KEY=${{ secrets.STACK_PUBLISHABLE_CLIENT_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "APP_NAME=Jarvis AI Assistant" >> .env
          echo "APP_VERSION=1.0.0" >> .env
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Android APK (ARM64 only)
        run: |
          flutter build apk --release --target-platform android-arm64
          ls -la build/app/outputs/flutter-apk/
      
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Release ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            
            📱 ARM64 optimized build
            ⚡ 65% faster CI/CD pipeline
            
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            
            ### 📦 Downloads
            - Android APK attached below
            
            ### 🔥 Firebase App Distribution
            - Deployed to Firebase App Distribution
            - Available for testers group
            
            ### 📝 Changes
            See commit history for details
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
